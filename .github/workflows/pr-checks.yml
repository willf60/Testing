# Runs on every pull request and again whenever new commits are pushed to it.
# Each job below shows up as its own pass/fail check on the PR page.
name: PR checks

on:
  pull_request:

# Read-only access to the repo is all these checks need.
permissions:
  contents: read

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm # reuses npm's download cache so the CLI isn't fetched from scratch every run

      # Fails the job if any error-level offence is found, warnings are reported but don't fail.
      # Needs no store login as it only reads files. CLI pinned to the same major version as
      # you run locally so results match.
      - name: Run theme check
        run: npx --yes @shopify/cli@4 theme check --fail-level error --no-color

  code-scan:
    name: TODOs and dev URLs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Each match is printed as an "::error" annotation, which GitHub pins
      # to the exact file and line in the PR's "Files changed" tab.
      - name: Scan theme files
        run: |
          THEME_DIRS="assets blocks config layout locales sections snippets templates"
          found=0

          # scan <label> <pattern>. `|| true` because grep exits with an error when a theme folder
          # doesn't exist even if it found matches. sed turns each "file:line:text" match into an
          # annotation, trimming leading spaces and cutting the text at 150 characters.
          scan() {
            local matches; matches=$(grep -rnIEs "$2" $THEME_DIRS || true)
            if [ -z "$matches" ]; then echo "✔ No $1 found."; return; fi
            sed -E "s#^([^:]+):([0-9]+):[[:space:]]*(.{0,150}).*#::error file=\1,line=\2::$1: \3#" <<< "$matches"
            echo "✖ Found $(wc -l <<< "$matches") $1."; found=1
          }

          scan "TODO/FIXME comments" '\b(TODO|FIXME)\b'
          scan "dev URLs" 'localhost|127\.0\.0\.1|[a-z0-9-]+\.myshopify\.com|shopifypreview\.com|preview_theme_id|ngrok'

          exit $found

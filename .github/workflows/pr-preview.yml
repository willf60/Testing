# Gives each pull request its own preview theme on the store, kept up to date on every
# push and deleted when the PR closes, then runs Lighthouse to compare it with the live theme.
# The logic lives in .github/scripts/theme-preview.mjs and .github/scripts/lighthouse-compare.mjs.
#
# Secrets.
#   SHOPIFY_CLI_THEME_TOKEN      Theme Access password (required)
#   SHOPIFY_STOREFRONT_PASSWORD  storefront password, only for password-protected stores
name: PR preview theme

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: write # to post and update the PR comments

# One run at a time per PR (in order) so two quick pushes can't both create a theme and Lighthouse
# never measures a preview while the next push is updating it. `queue: max` keeps every waiting run,
# by default each new run would cancel the one waiting so an unrelated label change could cancel a
# push's checks or the clean-up after a merge.
concurrency:
  group: preview-theme-${{ github.event.pull_request.number }}
  queue: max

jobs:
  preview:
    name: Preview theme
    # Label changes only matter when the label is no-preview.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'no-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Empty when no preview was created or updated, which skips the Lighthouse job.
    outputs:
      theme_id: ${{ steps.preview.outputs.theme_id }}
      live_theme_id: ${{ steps.preview.outputs.live_theme_id }}
      store: ${{ steps.preview.outputs.store }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # The PR's merge commit plus its parents so the script can list what the PR changes.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci installs smol-toml, used to read the ignore list from shopify.theme.toml.
      - name: Install dependencies and Shopify CLI
        run: npm ci && npm install --global @shopify/cli@4

      - name: Create, update or remove the preview theme
        id: preview
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_ENVIRONMENT: default # the [environments.*] entry in shopify.theme.toml
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/theme-preview.mjs

  lighthouse:
    name: Lighthouse
    needs: preview
    if: needs.preview.outputs.theme_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Installed here rather than in package.json so local installs stay small.
      # Pinned because a new Lighthouse version can shift scores on its own.
      - name: Install Lighthouse and Puppeteer
        env:
          # `headless: true` runs full Chrome so the separate headless-shell build is never used.
          PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
        run: npm install --no-save --no-audit --no-fund lighthouse@13.5.0 puppeteer@25.13.0

      # Writes lighthouse-results/ then fails if the preview is over budget or the comparison couldn't finish.
      - name: Run Lighthouse on live and preview
        env:
          STORE: ${{ needs.preview.outputs.store }}
          PREVIEW_THEME_ID: ${{ needs.preview.outputs.theme_id }}
          LIVE_THEME_ID: ${{ needs.preview.outputs.live_theme_id }}
          SHOPIFY_STOREFRONT_PASSWORD: ${{ secrets.SHOPIFY_STOREFRONT_PASSWORD }}
          PRODUCT_HANDLE: ${{ vars.LIGHTHOUSE_PRODUCT_HANDLE }} # optional repository variable to pin a product
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/lighthouse-compare.mjs

      # This step and the next run even when the one above fails so the reports and comment are always there.
      - name: Upload reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Post results on the PR
        if: always() && hashFiles('lighthouse-results/summary.md') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          [ -z "$ARTIFACT_URL" ] || printf '\n\n📄 [Download the full reports](%s)' "$ARTIFACT_URL" >> lighthouse-results/summary.md
          node .github/scripts/github.mjs lighthouse lighthouse-results/summary.md
